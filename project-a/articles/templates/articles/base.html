{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}文章管理{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{% static 'articles/style.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'articles:list' %}">文章管理</a>
    {% if user.is_authenticated %}
    <nav aria-label="主导航">
      <a href="{% url 'articles:list' %}">文章列表</a>
      <a href="{% url 'articles:create' %}">新建文章</a>
      <span>{{ user.get_username }}</span>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="secondary" type="submit">退出登录</button></form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% if messages %}<div aria-live="polite">{% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

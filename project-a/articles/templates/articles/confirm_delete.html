{% extends 'articles/base.html' %}
{% block content %}
<h1>删除文章</h1>
<p>确认删除“{{ article.title }}”吗？文章及附件将被删除，操作记录会保留。</p>
<form method="post">
  {% csrf_token %}
  <div class="actions"><button class="danger" type="submit">确认删除</button><a href="{% url 'articles:detail' article.pk %}">取消</a></div>
</form>
{% endblock %}
